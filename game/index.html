<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0605" />
    <title>猜字棚 · 顯影前說出你看見的</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="preload" href="lexicon.json" as="fetch" crossorigin />
    <link rel="modulepreload" href="engine.js" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=DM+Mono:wght@300;400;500&display=swap"
    />
    <link rel="stylesheet" href="game.css" />
  </head>
  <body>
    <div class="room">
      <!-- 相紙。顯影就發生在這裡。 -->
      <div class="print" id="print">
        <img id="shot" class="print-img" alt="" />
        <div class="print-grain" aria-hidden="true"></div>
        <div class="print-vignette" aria-hidden="true"></div>
        <div class="print-pins" id="pins" aria-hidden="true"></div>
      </div>

      <section class="screen screen-gate" id="gate">
        <h1 class="wordmark">猜字棚</h1>
        <div class="gate-body">
          <p class="eyebrow">排字匣 · 第五間</p>
          <p class="tagline">三張相紙。<br />在它定影之前，說出你看見的。</p>

          <div class="dial" id="heat" role="group" aria-label="尺度"></div>

          <button class="expose" id="start" type="button">
            <span class="expose-label">曝光</span>
          </button>

          <p class="gate-note" id="gate-note" role="status"></p>

          <p class="ledger">
            <span>最佳 <b id="best">0</b></span>
            <span class="ledger-gap"></span>
            <span>最長連勝 <b id="best-streak">0</b></span>
          </p>
        </div>
      </section>

      <section class="screen screen-play" id="play" hidden>
        <header class="hud">
          <div class="sheets" id="lives" aria-label="剩餘相紙"></div>
          <div class="counters">
            <span class="counter"><i>分</i><b id="score">0</b></span>
            <span class="counter"><i>連</i><b id="streak">0</b></span>
          </div>
        </header>

        <p class="develop-note" id="progress" role="status"></p>

        <footer class="tray">
          <div class="choices" id="choices"></div>
          <button class="ghost skip" id="skip" type="button">換一張</button>
        </footer>
      </section>

      <section class="screen screen-over" id="over" hidden>
        <div class="over-body">
          <p class="eyebrow">相紙用完了</p>
          <p class="final"><b id="final-score">0</b><i>分</i></p>
          <p class="over-sub">最長連勝 <b id="final-streak">0</b></p>

          <ol class="sheet-list" id="answers"></ol>

          <details class="pos">
            <summary>這張照片的完整 POS</summary>
            <pre id="positive"></pre>
          </details>

          <div class="over-actions">
            <button class="ghost" id="copy" type="button">複製 POS</button>
            <button class="expose" id="again" type="button">
              <span class="expose-label">再曝一張</span>
            </button>
          </div>
        </div>
      </section>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
