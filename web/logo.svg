<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title">
  <title id="title">排字匣</title>
  <rect width="32" height="32" rx="2" fill="#2a1814"/>
  <!-- 匚：活字匣，右側開口 -->
  <path
    d="M25 6.5H7v19h18"
    fill="none"
    stroke="#eee7d9"
