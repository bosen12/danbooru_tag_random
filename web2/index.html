<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d9cbb0" />
    <title>排字匣 · 活字樓</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="preload" href="lexicon.json" as="fetch" crossorigin />
    <link rel="modulepreload" href="boot.js" />
    <link rel="modulepreload" href="engine.js" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@600;700&display=swap"
      />
    </noscript>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="boot.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip" href="#cats">跳到活字盤</a>
    <header class="mast">
      <h1 class="wordmark" translate="no">
        <img class="brand-mark" src="logo.svg" width="36" height="36" alt="" aria-hidden="true" />
        <span class="wordmark-copy">活字樓<span>排字匣 · 撿字上架</span></span>
      </h1>
      <div class="ping" id="ping" data-ok="0"><i></i><span>Comfy…</span></div>
    </header>

    <div class="floor">
      <nav class="ruler" aria-label="跳到分類">
        <a href="#sec-quality">畫</a>
        <a href="#sec-subject">人</a>
        <a href="#sec-feature">相</a>
        <a href="#sec-pose">勢</a>
        <a href="#sec-clothing">衣</a>
        <a href="#sec-env">場</a>
      </nav>

      <main class="aisle" id="stage">
        <div class="stick">
          <div class="stick-label">撿字棍</div>
          <div class="tray" id="tray">
            <div class="tray-clip">
              <div class="tray-pad">
                <div class="tray-head">
                  <strong>必進這張</strong>
                  <span class="hint" id="tray-count"></span>
                </div>
                <div class="tags" id="tray-pins"></div>
              </div>
            </div>
          </div>
          <p class="hint stick-empty" id="stick-hint">從抽屜撿字，釘在這根棍子上。</p>
        </div>

        <div class="filter-bar" id="filter-bar">
          <div class="filter-row">
            <input id="q" type="search" placeholder="搜中文或英文…" autocomplete="off" spellcheck="false" />
            <div class="row view-filters" id="view-filters">
              <button type="button" class="seg" data-view="all" aria-pressed="true">全部</button>
              <button type="button" class="seg" data-view="pinned" aria-pressed="false">已撿</button>
              <button type="button" class="seg" data-view="banned" aria-pressed="false">封禁</button>
              <button type="button" class="seg" id="era-only" aria-pressed="true">只看這時代</button>
            </div>
          </div>
          <nav class="jump" hidden>
            <a href="#sec-quality">畫質</a>
            <a href="#sec-subject">人數</a>
            <a href="#sec-feature">長相</a>
            <a href="#sec-pose">姿勢</a>
            <a href="#sec-clothing">服裝</a>
            <a href="#sec-env">場景</a>
          </nav>
        </div>
        <div class="cats" id="cats"></div>
      </main>

      <aside class="galley" aria-label="校樣與規則">
        <div class="print-bar">
          <button type="button" class="primary" id="go"><span>付印</span></button>
          <button type="button" class="ghost" id="cancel" hidden>取消</button>
          <div class="status" id="status">一次一張付印</div>
        </div>
        <div class="results" id="results"></div>
        <div class="hud-block">
          <div class="field batch-field">
            <label for="n">一次幾張</label>
            <div class="batch-row">
              <input id="n" name="n" type="number" min="1" max="10" value="1" />
              <button
                type="button"
                class="same-switch"
                id="same-person"
                role="switch"
                aria-checked="false"
                aria-describedby="same-person-hint"
              >
                <span class="same-knob" aria-hidden="true"><i></i></span>
                <span class="same-copy">
                  <strong>同一個人</strong>
                  <em id="same-person-hint">多張鎖髮瞳胸，衣場照抽</em>
                </span>
              </button>
            </div>
          </div>
          <div class="field">
            <label>紙幅</label>
            <div class="row" id="sizes">
              <button type="button" class="seg" data-w="1024" data-h="1024" aria-pressed="true">方</button>
              <button type="button" class="seg" data-w="832" data-h="1216" aria-pressed="false">直</button>
              <button type="button" class="seg" data-w="1216" data-h="832" aria-pressed="false">橫</button>
            </div>
            <div class="row">
              <input id="width" name="width" type="number" min="256" max="2048" value="1024" aria-label="寬" />
              <input id="height" name="height" type="number" min="256" max="2048" value="1024" aria-label="高" />
            </div>
          </div>
          <div class="field">
            <label>畫面裡有誰</label>
            <div class="row">
              <button type="button" class="chip-toggle" id="girl" aria-pressed="true">女</button>
              <button type="button" class="chip-toggle" id="boy" aria-pressed="false">男</button>
              <button type="button" class="chip-toggle" id="cast-any" aria-pressed="false">不限</button>
            </div>
            <p class="hint clash" id="cast-clash" hidden></p>
          </div>
          <fieldset class="heat">
            <legend>尺度</legend>
            <div class="row" id="presets">
              <button type="button" class="seg" data-preset="tease" aria-pressed="false">偏誘惑</button>
              <button type="button" class="seg" data-preset="mixed" aria-pressed="true">混合</button>
              <button type="button" class="seg" data-preset="sex" aria-pressed="false">偏性愛</button>
            </div>
            <div class="row" id="heats">
              <button type="button" class="chip-toggle" data-heat="tease" aria-pressed="true">誘惑</button>
              <button type="button" class="chip-toggle" data-heat="flash" aria-pressed="true">走光</button>
              <button type="button" class="chip-toggle" data-heat="sex" aria-pressed="true">性愛</button>
            </div>
          </fieldset>
          <fieldset class="heat">
            <legend>時代</legend>
            <div class="row" id="eras"></div>
            <p class="hint clash" id="era-clash" hidden></p>
          </fieldset>
          <div class="field">
            <label>每段抽幾個</label>
            <div class="count-grid" id="counts"></div>
          </div>
          <div class="legend" aria-label="詞庫點法">
            <span class="tag" data-state="pool" data-locked="1">盤中</span>
            <span class="tag" data-state="pinned" data-locked="1">已撿</span>
            <span class="tag" data-state="banned" data-ban="mutex" data-locked="1">互斥</span>
            <span class="tag" data-state="banned" data-ban="user" data-locked="1">關掉</span>
          </div>
          <button type="button" class="ghost" id="clear-pins">倒掉棍子</button>
        </div>
      </aside>
    </div>
    <div class="live" id="live" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
