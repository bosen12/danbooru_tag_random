<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1217" />
    <title>墨池 · 疊印台</title>
    <meta name="description" content="墨池的疊印台：一張牌是一層墨，疊上版就看到校樣跟著變；挑好一張試印再付印。" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="lexicon.json" as="fetch" crossorigin />
    <link rel="modulepreload" href="engine.js" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chiron+Hei+HK:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap"
    />
    <!-- 牌面、按鈕、桅杆、彈窗跟墨池工作臺同一套（card.css、styles.css），疊印台自己的版面在 fuse.css。 -->
    <link rel="stylesheet" href="card.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="fuse.css" />
    <link rel="stylesheet" href="lora.css" />
  </head>
  <body class="fuse">
    <header class="mast">
      <nav class="crumbs" aria-label="墨池">
        <a class="crumb-back" href="./">墨池</a>
        <h1 class="wordmark">疊印台</h1>
      </nav>
      <div class="segmented" id="rating" role="radiogroup" aria-label="尺度分級"></div>
      <div class="mast-tools" id="mast-tools">
        <button class="ghost" id="rules-btn" type="button">規則</button>
        <button class="ghost" id="sound-btn" type="button" aria-pressed="true">聲音</button>
        <div class="ping" id="ping" data-ok=""><i></i><span>Comfy…</span></div>
      </div>
    </header>

    <section class="line" id="line" aria-labelledby="line-title">
      <h2 class="line-title" id="line-title">晾紙</h2>
      <ol class="line-list" id="line-list"></ol>
      <p class="line-empty" id="line-empty">付印的作品會夾在這條繩上。點一張可以回到它的版。</p>
    </section>

    <div class="press">
      <aside class="case" id="case" aria-labelledby="case-title">
        <div class="case-head">
          <h2 id="case-title">字盒</h2>
          <span class="case-count" id="case-count"></span>
        </div>
        <input class="case-q" id="case-q" type="search" placeholder="找牌：紅髮、kimono…（按 /）" aria-label="找牌" autocomplete="off" />
        <div class="case-tabs" id="case-tabs" role="group" aria-label="花色"></div>
        <div class="case-grid" id="case-grid" role="group" aria-label="字盒裡的牌：點一下放上版，再點一下拿下來"></div>
      </aside>

      <main class="proofing" id="proofing">
        <div class="proof-head">
          <p class="proof-caption" id="proof-caption" aria-live="polite"></p>
          <div class="view-toggle" id="view-toggle" role="radiogroup" aria-label="看校樣或成品" hidden></div>
        </div>
        <figure class="proof" id="proof" aria-label="校樣"></figure>
        <p class="colophon" id="colophon"></p>
        <div class="trials-head">
          <h2 class="trials-title" id="trials-title">試印</h2>
          <p class="trials-hint">同一批種子，每疊一張就重印一次。挑一張付印。</p>
          <button class="quiet-btn" id="reroll" type="button" title="換一批種子（R）">換一批</button>
        </div>
        <div class="trials" id="trials" role="radiogroup" aria-labelledby="trials-title"></div>
      </main>

      <aside class="plate" id="plate" aria-labelledby="plate-title">
        <div class="plate-head">
          <h2 id="plate-title">版</h2>
          <p class="plate-sub" id="plate-sub"></p>
          <div class="plate-acts">
            <button class="quiet-btn" id="undo" type="button" disabled>撤回</button>
            <button class="quiet-btn" id="clear" type="button" disabled>清版</button>
          </div>
        </div>
        <div class="plate-scroll" id="plate-scroll">
          <div class="registers" id="registers"></div>
        </div>
        <div class="print-bar" id="print-bar"></div>
        <p class="keys-hint" aria-hidden="true"><kbd>/</kbd> 找牌 <kbd>Z</kbd> 撤回 <kbd>1</kbd>–<kbd>4</kbd> 試印 <kbd>R</kbd> 換一批 <kbd>P</kbd> 付印</p>
      </aside>
    </div>

    <button class="mini-proof" id="mini-proof" type="button" aria-label="回到校樣" hidden></button>
    <div class="sr-only" id="live" aria-live="polite"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="fuse.js"></script>
  </body>
</html>
