<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c100c" />
    <title>排字匣 · 暗房</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="preload" href="lexicon.json" as="fetch" crossorigin />
    <link rel="modulepreload" href="boot.js" />
    <link rel="modulepreload" href="engine.js" />
    <link rel="modulepreload" href="lora.js" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=IBM+Plex+Mono:wght@400&family=Syne:wght@700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=IBM+Plex+Mono:wght@400&family=Syne:wght@700;800&display=swap"
      />
    </noscript>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="boot.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="lora.css" />
  </head>
  <body>
    <a class="skip" href="#cats">跳到詞庫</a>
    <header class="mast">
      <h1 class="wordmark" translate="no">
        <img class="brand-mark" src="logo.svg" width="36" height="36" alt="" aria-hidden="true" />
        <span class="wordmark-copy">暗房<span>排字匣 · 曝光</span></span>
      </h1>
      <div class="mast-tools" id="mast-tools">
        <div class="ping" id="ping" data-ok="0"><i></i><span>Comfy…</span></div>
      </div>
    </header>

    <div class="darkroom">
      <section class="well" aria-label="出圖">
        <div class="tray" id="tray">
          <div class="tray-clip">
            <div class="tray-pad">
              <div class="tray-head">
                <strong>已上片</strong>
                <span class="hint" id="tray-count"></span>
              </div>
              <div class="tags" id="tray-pins"></div>
            </div>
          </div>
        </div>
        <div
          class="results"
          id="results"
          data-empty="還沒有片。&#10;下面挑好字，按「曝光」。"
        ></div>
      </section>

      <aside class="hud" aria-label="抽卡設定">
        <div class="field batch-field">
          <label for="n">一次幾張</label>
          <div class="batch-row">
            <input id="n" name="n" type="number" min="1" max="10" value="1" />
            <button
              type="button"
              class="same-switch"
              id="same-person"
              role="switch"
              aria-checked="false"
              aria-describedby="same-person-hint"
            >
              <span class="same-knob" aria-hidden="true"><i></i></span>
              <span class="same-copy">
                <strong>同一個人</strong>
                <em id="same-person-hint">多張鎖髮瞳胸，衣場照抽</em>
              </span>
            </button>
          </div>
        </div>
        <div class="field">
          <label>片幅</label>
          <div class="row" id="sizes">
            <button type="button" class="seg" data-w="1024" data-h="1024" aria-pressed="true">方</button>
            <button type="button" class="seg" data-w="832" data-h="1216" aria-pressed="false">直</button>
            <button type="button" class="seg" data-w="1216" data-h="832" aria-pressed="false">橫</button>
          </div>
          <div class="row">
            <input id="width" name="width" type="number" min="256" max="2048" value="1024" aria-label="寬" />
            <input id="height" name="height" type="number" min="256" max="2048" value="1024" aria-label="高" />
          </div>
        </div>
        <div class="field">
          <label>畫面裡有誰</label>
          <div class="row">
            <button type="button" class="chip-toggle" id="girl" aria-pressed="true">女</button>
            <button type="button" class="chip-toggle" id="boy" aria-pressed="false">男</button>
            <button type="button" class="chip-toggle" id="cast-any" aria-pressed="false">不限</button>
          </div>
          <p class="hint clash" id="cast-clash" hidden></p>
        </div>
        <fieldset class="heat">
          <legend>尺度</legend>
          <p class="hint">可勾多個。只勾活動＝日常。混合＝誘惑＋走光＋性愛。</p>
          <div class="row" id="heats">
            <button type="button" class="chip-toggle" data-heat="mixed" aria-pressed="true">混合</button>
            <button type="button" class="chip-toggle" data-heat="activity" aria-pressed="false">活動</button>
            <button type="button" class="chip-toggle" data-heat="tease" aria-pressed="false">誘惑</button>
            <button type="button" class="chip-toggle" data-heat="flash" aria-pressed="false">走光</button>
            <button type="button" class="chip-toggle" data-heat="sex" aria-pressed="false">性愛</button>
          </div>
          <p class="hint clash" id="heat-clash" hidden></p>
          <div class="row">
            <button type="button" class="chip-toggle" id="draw-job" aria-pressed="false">抽職業</button>
          </div>
        </fieldset>
        <fieldset class="heat">
          <legend>時代</legend>
          <div class="row" id="eras"></div>
          <p class="hint clash" id="era-clash" hidden></p>
        </fieldset>
        <div class="field">
          <label>每段抽幾個</label>
          <div class="count-grid" id="counts"></div>
        </div>
        <div class="legend" aria-label="詞庫點法">
          <span class="tag" data-state="pool" data-locked="1">池中</span>
          <span class="tag" data-state="pinned" data-locked="1">上片</span>
          <span class="tag" data-state="banned" data-ban="mutex" data-locked="1">互斥</span>
          <span class="tag" data-state="banned" data-ban="user" data-locked="1">關掉</span>
        </div>
        <div class="row">
          <button type="button" class="ghost" id="clear-pins">清掉上片</button>
          <button type="button" class="ghost" id="clear-weights">清掉權重</button>
          <button type="button" class="ghost" id="save-preset">存上片</button>
        </div>
        <div class="row" id="presets"></div>
      </aside>

      <section class="sheet" id="stage">
        <div class="sheet-bar">
          <button type="button" class="primary" id="go"><span>曝光</span></button>
          <button type="button" class="ghost" id="cancel" hidden>取消</button>
          <div class="status" id="status">一次一張，對準再按</div>
        </div>
        <div class="filter-bar" id="filter-bar">
          <nav class="jump" aria-label="跳到分類">
            <a href="#sec-quality">畫質</a>
            <a href="#sec-subject">人數</a>
            <a href="#sec-feature">長相</a>
            <a href="#sec-pose">姿勢</a>
            <a href="#sec-clothing">服裝</a>
            <a href="#sec-env">場景</a>
          </nav>
          <div class="filter-row">
            <input id="q" type="search" placeholder="搜中文或英文…" autocomplete="off" spellcheck="false" />
            <div class="row view-filters" id="view-filters">
              <button type="button" class="seg" data-view="all" aria-pressed="true">全部</button>
              <button type="button" class="seg" data-view="pinned" aria-pressed="false">上片</button>
              <button type="button" class="seg" data-view="banned" aria-pressed="false">封禁</button>
              <button type="button" class="seg" id="era-only" aria-pressed="true">只看這時代</button>
            </div>
          </div>
        </div>
        <div class="cats" id="cats"></div>
      </section>
    </div>
    <div class="live" id="live" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
